services:
  app:
    build: .
    init: true
    ports:
      - "${EXAM_BIND_ADDRESS:-0.0.0.0}:${EXAM_PORT:-8710}:8710"
    volumes:
      - type: bind
        source: ./uploads
        target: /app/data/media
        bind:
          create_host_path: false
      - type: bind
        source: ./config.json
        target: /app/config.json
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: /data/nextcloud/lidaning/db
        target: /data/nextcloud/lidaning/db
        bind:
          create_host_path: false
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8710/').then(response => process.exit(response.ok ? 0 : 1), () => process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s
